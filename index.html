<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b36" />
    <script>
      /* Миттєве застосування збереженої теми (без «блимання» кольорів) */
      try {
        var t = JSON.parse(localStorage.getItem("ts-theme") || "null");
        if (t && typeof t.css === "string" && t.css.length < 6000) {
          var st = document.createElement("style");
          st.id = "ts-theme";
          st.textContent = t.css;
          document.head.appendChild(st);
        }
      } catch (e) {}
    </script>
    <title>TechScout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
